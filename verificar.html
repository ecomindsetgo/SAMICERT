<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar documento — SAMICERT</title>
<script type="module" src="verificar.js"></script>
<style>
  :root{
    --azul:#1f3864; --gris:#64748b; --borde:#e2e8f0;
    --verde:#16823a; --verdefondo:#f6fbf8;
    --rojo:#b42318; --rojofondo:#fff7f5;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:#f2f4f7; margin:0; padding:28px 16px 60px;
    color:#1f2933;
  }
  .tarjeta{
    max-width:560px; margin:0 auto; background:#fff; border-radius:10px;
    border:1px solid var(--borde); padding:28px 26px; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .marca{ text-align:center; margin-bottom:6px; }
  .marca .institucion{ font-size:13px; font-weight:700; color:var(--azul); letter-spacing:.3px; }
  .marca .area{ font-size:12px; color:var(--gris); margin-top:2px; }
  h1{ text-align:center; font-size:20px; color:var(--azul); margin:18px 0 22px; }
  label{ font-size:13px; font-weight:600; display:block; margin-bottom:6px; }
  .fila-busqueda{ display:flex; gap:8px; }
  input[type=text]{
    flex:1; padding:10px 12px; border:1px solid var(--borde); border-radius:8px;
    font-size:15px; text-transform:uppercase; letter-spacing:.4px;
  }
  button{
    background:var(--azul); color:#fff; border:none; border-radius:8px;
    padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer;
  }
  button:disabled{ opacity:.6; cursor:default; }
  .resultado{ margin-top:22px; border-radius:8px; padding:16px 16px; display:none; }
  .resultado.oculto{ display:none; }
  .resultado.valido{ background:var(--verdefondo); border-left:4px solid var(--verde); }
  .resultado.invalido{ background:var(--rojofondo); border-left:4px solid var(--rojo); }
  .resultado.cargando{ background:#f8fafc; border-left:4px solid var(--gris); }
  .titulo-resultado{ font-weight:700; font-size:15px; margin-bottom:8px; }
  .titulo-resultado.valido{ color:var(--verde); }
  .titulo-resultado.invalido{ color:var(--rojo); }
  .detalle{ font-size:13.5px; line-height:1.9; }
  .detalle strong{ color:#1f2933; }
  .recert{ margin-top:10px; padding-top:10px; border-top:1px dashed rgba(180,35,24,.3); color:var(--rojo); font-size:13px; }
  .nota-pie{ margin-top:26px; font-size:11.5px; color:var(--gris); text-align:center; line-height:1.6; }
</style>
</head>
<body>

  <div class="tarjeta">
    <div class="marca">
      <div class="institucion">CORTE SUPERIOR DE JUSTICIA DEL SANTA</div>
      <div class="area">Línea de Producción de Microformas Digitales</div>
    </div>
    <h1>Consulta de validez de documento — SAMICERT</h1>

    <label for="inputCodigo">Código de certificación</label>
    <div class="fila-busqueda">
      <input type="text" id="inputCodigo" placeholder="CERT-2026-XXXXXXXXXXXX" autocomplete="off">
      <button id="btnConsultar" type="button">Consultar</button>
    </div>

    <div id="resultado" class="resultado oculto"></div>

    <div class="nota-pie">
      Esta página permite verificar, a partir del código impreso en el documento,
      si corresponde a una certificación emitida por SAMICERT. No requiere iniciar sesión.
    </div>
  </div>

</body>
</html>
